name: Reflekt evidence (manual)

# Records evidence videos on demand. Never runs automatically.
#
# Run it from the Actions tab, or:
#   gh workflow run "Reflekt evidence (manual)" --ref <branch>
#   gh workflow run "Reflekt evidence (manual)" --ref <branch> -f flow=note_search
#
# The recording is a by-product of a passing test: if the flow fails, the job
# fails and no video is produced, so a video always means the flow ran green.
#
# Faster alternative for local work: scripts/record_evidence.sh

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Flow to record (test name without _test.dart). Empty records all flows.'
        required: false
        default: ''

defaults:
  run:
    working-directory: reflekt

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The runner is a VM without nested virtualisation on most images, so KVM
      # has to be enabled explicitly or the emulator falls back to software and
      # times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # reactivecircus/android-emulator-runner owns the emulator lifecycle, so
      # record_evidence.sh finds one already running and reuses it.
      - name: Record evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: reflekt
          script: ./scripts/record_evidence.sh ${{ inputs.flow }}

      # Always upload, especially on failure — the frames and step trace are how
      # you debug a broken flow, since web profile builds report empty
      # assertion details.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflekt-evidence
          path: |
            reflekt/evidence/*.gif
            reflekt/evidence/*.mp4
          if-no-files-found: warn
          retention-days: 30

      - name: How to use this
        if: success()
        run: |
          echo "Download the artifact above, commit the files into reflekt/evidence/,"
          echo "and embed the GIF in the PR body:"
          echo
          echo "  ![flow](https://raw.githubusercontent.com/${{ github.repository }}/<branch>/reflekt/evidence/<flow>.gif)"
